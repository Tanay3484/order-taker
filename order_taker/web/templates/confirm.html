{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Just checking</h1>
  <p>{{ message }}</p>
  <form method="post" action="{{ action }}" class="row">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="force" value="1">
    <button class="btn primary">Yes, apply it</button>
    <a class="btn" href="{{ back }}">No, go back</a>
  </form>
</section>
{% endblock %}
